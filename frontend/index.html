<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ORLIXA AI — Orlixa Labs</title>
    <meta
      name="description"
      content="ORLIXA AI chat platform by Orlixa Labs, powered by OpenRouter API."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/highlight.js@11.11.1/styles/github-dark.min.css"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body data-page="chat">
    <div id="sidebar-backdrop" class="sidebar-backdrop"></div>

    <div class="app-layout">
      <aside id="sidebar" class="sidebar" aria-label="Conversation navigation">
        <div class="sidebar-header">
          <div class="brand-lockup">
            <svg width="24" height="24" viewBox="0 0 28 28" fill="none" aria-hidden="true">
              <rect x="2" y="2" width="24" height="24" rx="7" stroke="#38BDF8" stroke-width="2" />
              <circle cx="14" cy="14" r="5" fill="#38BDF8" />
            </svg>
            <span>ORLIXA AI</span>
          </div>
          <button id="close-sidebar-btn" class="icon-btn mobile-menu-btn" type="button" aria-label="Close sidebar">
            ✕
          </button>
        </div>

        <button id="new-chat-btn" class="new-chat-btn" type="button">
          <span>+ New Chat</span>
        </button>

        <div class="sidebar-section-label">Recent Conversations</div>
        <nav id="conversation-list" class="conversation-list" aria-label="Conversation history"></nav>

        <div class="sidebar-footer">
          <div class="user-meta">
            <div id="user-display-name" class="user-name">Loading...</div>
            <div id="user-display-email" class="user-email"></div>
          </div>
          <button id="settings-btn" class="icon-btn" type="button" title="Settings" aria-label="Open settings">
            ⚙
          </button>
          <button id="logout-btn" class="icon-btn" type="button" title="Sign out" aria-label="Sign out">
            ↪
          </button>
        </div>
      </aside>

      <main class="main-pane">
        <header class="topbar">
          <div class="topbar-left">
            <button id="open-sidebar-btn" class="icon-btn mobile-menu-btn" type="button" aria-label="Open menu">
              ☰
            </button>
            <div id="topbar-title" class="topbar-title">ORLIXA AI</div>
          </div>
          <div style="display:flex; align-items:center; gap:10px; font-size:13px; color:var(--text-secondary);"></div>
        </header>

        <section id="chat-scroll" class="chat-scroll" aria-live="polite">
          <div id="chat-container" class="chat-container">
            <div id="welcome-screen" class="welcome-screen">
              <div class="brand-lockup">
                <svg width="32" height="32" viewBox="0 0 28 28" fill="none" aria-hidden="true">
                  <rect x="2" y="2" width="24" height="24" rx="7" stroke="#38BDF8" stroke-width="2" />
                  <circle cx="14" cy="14" r="5" fill="#38BDF8" />
                </svg>
                <span>ORLIXA AI</span>
              </div>
              <h1 id="welcome-greeting" class="welcome-heading">Hello</h1>
              <p class="welcome-copy">What can I help you with?</p>
            </div>

            <div id="messages-list"></div>
          </div>
        </section>

        <div class="composer-wrap">
          <div id="chat-error-banner" class="auth-alert auth-alert-error" style="max-width:820px; margin:0 auto 10px;" hidden></div>
          <form id="chat-form" class="composer-box">
            <textarea
              id="message-input"
              class="composer-textarea"
              rows="1"
              placeholder="Message ORLIXA AI..."
              aria-label="Message input"
            ></textarea>
            <button id="stop-btn" class="composer-stop-btn" type="button" hidden>Stop</button>
            <button id="send-btn" class="composer-send-btn" type="submit">Send</button>
          </form>
          <div class="composer-hint">
            <span>Enter to send · Shift+Enter for new line</span>
            <span id="char-counter">0 / 4000</span>
          </div>
        </div>
      </main>
    </div>

    <div id="settings-modal" class="modal-overlay" hidden>
      <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="settings-title">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
          <h2 id="settings-title" class="auth-title" style="margin:0; font-size:20px;">Account & Preferences</h2>
          <button id="close-settings-btn" class="icon-btn" type="button" aria-label="Close settings">✕</button>
        </div>
        <form id="settings-form">
          <div class="field-group">
            <label class="field-label" for="settings-name">Full name</label>
            <input id="settings-name" class="field-input" type="text" maxlength="120" />
          </div>
          <div class="field-group">
            <label class="field-label" for="settings-theme">Theme</label>
            <select id="settings-theme" class="field-input">
              <option value="dark">Dark Navy</option>
              <option value="light">Light Slate</option>
            </select>
          </div>
          <div style="display:flex; gap:10px; margin-top:20px;">
            <button type="submit" class="btn-primary">Save preferences</button>
          </div>
        </form>
      </div>
    </div>

    <script src="./config.js" onerror="window.ORLIXA_CONFIG = window.ORLIXA_CONFIG || {};"></script>
    <script type="module" src="./app.js"></script>
  </body>
</html>
